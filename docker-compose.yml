name: stockguard

services:
  postgres:
    image: postgres:16-alpine
    container_name: stockguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${STOCKGUARD_DB_NAME:-stockguard_db}
      POSTGRES_USER: ${STOCKGUARD_DB_USERNAME:?Define STOCKGUARD_DB_USERNAME en .env}
      POSTGRES_PASSWORD: ${STOCKGUARD_DB_PASSWORD:?Define STOCKGUARD_DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:${STOCKGUARD_DB_PORT:-5437}:5432"
    volumes:
      - stockguard-postgres-data:/var/lib/postgresql/data
    networks:
      - stockguard-network
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  stockguard-postgres-data:
    name: stockguard-postgres-data

networks:
  stockguard-network:
    name: stockguard-network
